name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # pnpm check's tasks, split into jobs that run in parallel, so no job's tests compete with
  # another's for the runner's CPU. No dependency caching anywhere in this workflow, because it
  # publishes packages
  static:
    name: Lint, typecheck, build, and format
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, and build
        run: node internal/vitest-config/src/run-test-suite.ts full run lint typecheck build

      - name: Check the formatting
        run: pnpm format:check

  tests:
    name: Unit and integration tests, with coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # the React packages' coverage includes their browser tests' Chromium run; the integration
      # tests start PostgreSQL and Redis containers in the runner's Docker. The script bounds the
      # downloads, falling back to Ubuntu's own mirror when the runner's Azure one crawls
      - name: Install Chromium
        run: .github/scripts/install-browsers.sh packages/jg-sw chromium

      # four packages at a time on the runner's four CPUs, except the four whose coverage runs
      # Chromium: beside the other suites, their browser projects didn't start within a minute
      - name: Run the tests with coverage
        run: node internal/vitest-config/src/run-test-suite.ts full run test:coverage --concurrency=4 --filter='!jg-react' --filter='!jg-react-router' --filter='!jg-tanstack-query' --filter='!jg-react-ui'

      - name: Run the Chromium packages' tests with coverage, one at a time
        run: node internal/vitest-config/src/run-test-suite.ts full run test:coverage --concurrency=1 --filter=jg-react --filter=jg-react-router --filter=jg-tanstack-query --filter=jg-react-ui

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browsers
        run: .github/scripts/install-browsers.sh packages/jg-sw chromium firefox webkit

      - name: Run the browser tests
        run: node internal/vitest-config/src/run-test-suite.ts full run test:browser

  # the end-to-end suites run in three Playwright shards on separate runners, because the website's
  # axe scans of its largest pages are CPU-bound. Playwright splits the tests in order, so the shards
  # aren't even: the slowest scans fall in the second
  e2e:
    name: End-to-end tests (${{ matrix.shard }} of 3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the browsers
        run: .github/scripts/install-browsers.sh packages/jg-sw chromium firefox webkit

      # builds the site, which verify-build checks, and runs this shard of each end-to-end suite;
      # each suite owns a browser worker pool, so only one suite runs on the four-CPU runner;
      # turbo passes the shard to the test:e2e tasks only, not to the builds they wait for
      - name: Run the end-to-end tests
        run: node internal/vitest-config/src/run-test-suite.ts full run test:e2e --concurrency=1 -- --shard=${{ matrix.shard }}/3

      # on main, the first shard hands the site it built to the deploy job, which waits for every
      # shard
      - name: Upload the site
        if: matrix.shard == 1 && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: website/dist

  release:
    name: Release checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages
        run: pnpm turbo run build --filter='./packages/*'

      - name: Install the rendered Astro fixture's browsers
        run: .github/scripts/install-browsers.sh packages/jg-personal-astro-ui chromium firefox webkit

      - name: Check the release
        if: github.event_name != 'push' || github.ref != 'refs/heads/main'
        run: pnpm release:verify

      # on main, the same checks run while packing, and the tarballs are handed to the publish job
      - name: Pack the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm release:pack

      - name: Upload the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  # the packages support Node.js 22.17.0, except jg-personal-astro-ui, which needs 24. The build
  # scripts are TypeScript run by Node.js itself, so the packages build on the latest LTS first, and
  # the tests then run with --only, which builds nothing
  floor:
    name: Package tests on Node.js 22.17.0 and 24.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js for the build
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the packages
        run: pnpm turbo run build --filter='./packages/*'

      - name: Set up Node.js 22.17.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.0
          package-manager-cache: false

      # four packages at a time, as in the tests job. Each vitest.config.ts loads the shared Vitest
      # config, which is TypeScript, and Node.js strips types by default only from 22.18.0
      - name: Run the package unit and integration tests on Node.js 22.17.0
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: |
          node --version
          pnpm turbo run test:unit test:integration --filter='./packages/*' --filter='!jg-personal-astro-ui' --only --concurrency=4

      - name: Set up Node.js 24.0.0
        uses: actions/setup-node@v7
        with:
          node-version: 24.0.0
          package-manager-cache: false

      - name: Run jg-personal-astro-ui's unit tests on Node.js 24.0.0
        run: |
          node --version
          pnpm turbo run test:unit --filter=jg-personal-astro-ui --only

  # the filesystem, process, Git, and environment packages behave differently on each system, so
  # their tests also run on Windows and macOS, on the lowest Node.js version the packages support
  platforms:
    name: Package tests on ${{ matrix.os }}, Node.js 22.17.0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Git on the Windows runners turns LF into CRLF on checkout, and in the repositories the tests
      # create, while the tests expect files as they're committed
      - name: Keep line endings as committed
        run: git config --global core.autocrlf false

      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js for the build
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      # only the root's turbo, the four packages' dependencies, and @jg-packages/api-reference,
      # whose TypeDoc every package's build runs to write its API.md
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter=. --filter='jg-fs...' --filter='jg-process...' --filter='jg-git-commands...' --filter='jg-env...' --filter='@jg-packages/api-reference...'

      - name: Build the packages
        run: pnpm turbo run build --filter=jg-fs --filter=jg-process --filter=jg-git-commands --filter=jg-env

      - name: Set up Node.js 22.17.0
        uses: actions/setup-node@v7
        with:
          node-version: 22.17.0
          package-manager-cache: false

      # as in the floor job, the type stripping loads the shared Vitest config; --continue lets one
      # run report every package that fails on the system
      - name: Run the package unit and integration tests
        env:
          NODE_OPTIONS: --experimental-strip-types
        run: |
          node --version
          pnpm turbo run test:unit test:integration --filter=jg-fs --filter=jg-process --filter=jg-git-commands --filter=jg-env --only --concurrency=4 --continue

  deploy:
    name: Deploy the site
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static, tests, browser, e2e, release, floor, platforms]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # one deploy at a time; a newer one waits for the one in progress instead of cancelling it
    concurrency:
      group: pages-production
      cancel-in-progress: false
    # id-token lets GitHub Pages verify that the deployment comes from this workflow
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish:
    name: Publish to npm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static, tests, browser, e2e, release, floor, platforms]
    runs-on: ubuntu-latest
    # npm takes a few minutes to serve each new version, which the job waits for
    timeout-minutes: 30
    # id-token lets npm verify this workflow as the packages' trusted publisher
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # trusted publishing needs npm 11.5.1 or later
      - name: Install npm
        run: npm install --global npm@11.12.1

      - name: Download the release
        uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      # the publish command imports only Node.js built-ins, so no dependency is installed here
      - name: Publish the new versions
        run: node internal/release-checks/src/cli.ts publish --from release

      - name: Upload the published versions
        uses: actions/upload-artifact@v7
        with:
          name: published
          path: release/published.json
          if-no-files-found: error
          retention-days: 1

  tag:
    name: Tag the release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # the credentials stay, because the tag command pushes the tags
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Download the release
        uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Download the published versions
        uses: actions/download-artifact@v8
        with:
          name: published
          path: published

      - name: Tag the published versions
        run: node internal/release-checks/src/cli.ts tag --from release --published published/published.json
