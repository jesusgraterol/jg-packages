name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # no dependency caching anywhere in this workflow, because it publishes packages
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # the end-to-end tests run in Chromium, with the system libraries it needs
      - name: Install Chromium
        run: pnpm --filter jg-sw exec playwright install --with-deps chromium

      - name: Run every check
        run: pnpm check

      # on main, the checked tarballs are packed once and handed to the publish job
      - name: Pack the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: pnpm release:pack

      - name: Upload the release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  floor:
    name: Package tests on Node.js 24.0.0
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.0.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the package unit and integration tests
        run: pnpm turbo run test:unit test:integration --filter='./packages/*'

  publish:
    name: Publish to npm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, floor]
    runs-on: ubuntu-latest
    # npm takes a few minutes to serve each new version, which the job waits for
    timeout-minutes: 30
    # id-token lets npm verify this workflow as the packages' trusted publisher
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # trusted publishing needs npm 11.5.1 or later
      - name: Install npm
        run: npm install --global npm@11.12.1

      - name: Download the release
        uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      # the publish command imports only Node.js built-ins, so no dependency is installed here
      - name: Publish the new versions
        run: node internal/release-checks/src/cli.ts publish --from release

      - name: Upload the published versions
        uses: actions/upload-artifact@v7
        with:
          name: published
          path: release/published.json
          if-no-files-found: error
          retention-days: 1

  tag:
    name: Tag the release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      # the credentials stay, because the tag command pushes the tags
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          package-manager-cache: false

      - name: Download the release
        uses: actions/download-artifact@v8
        with:
          name: release
          path: release

      - name: Download the published versions
        uses: actions/download-artifact@v8
        with:
          name: published
          path: published

      - name: Tag the published versions
        run: node internal/release-checks/src/cli.ts tag --from release --published published/published.json
